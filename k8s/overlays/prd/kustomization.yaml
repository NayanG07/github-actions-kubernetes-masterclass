apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

bases:
  - ../../base

namespace: skillpulse-prd

commonLabels:
  environment: prd

images:
  - name: nayuu/skillpulse-backend
    newTag: latest
  - name: nayuu/skillpulse-frontend
    newTag: latest

patches:
  # 3 replicas in prd — HA, survives one node going down
  - target:
      kind: Deployment
      name: backend
    patch: |-
      - op: replace
        path: /spec/replicas
        value: 3

  - target:
      kind: Deployment
      name: frontend
    patch: |-
      - op: replace
        path: /spec/replicas
        value: 3

  # Prd NodePort: 30080 (the "default" from base)
  - target:
      kind: Service
      name: frontend
    patch: |-
      - op: replace
        path: /spec/ports/0/nodePort
        value: 30080

  # Prd gets full resource limits
  - target:
      kind: Deployment
      name: backend
    patch: |-
      - op: replace
        path: /spec/template/spec/containers/0/resources/limits/cpu
        value: "500m"
      - op: replace
        path: /spec/template/spec/containers/0/resources/limits/memory
        value: "256Mi"

  # Prd-only: pod disruption budget — never take all replicas down at once
  - target:
      kind: PodDisruptionBudget
      name: backend-pdb
    patch: |-
      - op: replace
        path: /spec/minAvailable
        value: 2
