apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization


namespace: skillpulse-prd

labels:
- pairs:
    environment: prd

images:
- name: nayuu/skillpulse-backend
  newName: nayuu/skillpulse-backend
  newTag: 82cc808
- name: nayuu/skillpulse-frontend
  newName: nayuu/skillpulse-frontend
  newTag: 82cc808

  # 3 replicas in prd — HA, survives one node going down


  # Prd NodePort: 30080 (the "default" from base)

  # Prd gets full resource limits

  # Prd-only: pod disruption budget — never take all replicas down at once
patches:
- patch: |-
    - op: replace
      path: /spec/replicas
      value: 3
  target:
    kind: Deployment
    name: backend
- patch: |-
    - op: replace
      path: /spec/replicas
      value: 3
  target:
    kind: Deployment
    name: frontend
- patch: |-
    - op: replace
      path: /spec/ports/0/nodePort
      value: 30083
  target:
    kind: Service
    name: frontend
- patch: |-
    - op: replace
      path: /spec/template/spec/containers/0/resources/limits/cpu
      value: "500m"
    - op: replace
      path: /spec/template/spec/containers/0/resources/limits/memory
      value: "256Mi"
  target:
    kind: Deployment
    name: backend
- patch: |-
    - op: replace
      path: /spec/minAvailable
      value: 2
  target:
    kind: PodDisruptionBudget
    name: backend-pdb
resources:
- ../../base
