name: CI

on:
  workflow_dispatch:   # manual trigger for testing
  push:
    branches: [main]
    paths-ignore:
      - 'k8s/**'
      - 'docs/**'
      - '**/*.md'

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v4

      - uses: docker/login-action@v4
        if: ${{ vars.DEPLOY_ENABLED == 'true' }}
        with:
          username: ${{ vars.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build and push backend
        uses: docker/build-push-action@v7
        with:
          context: ./backend
          push: ${{ vars.DEPLOY_ENABLED == 'true' }}
          tags: |
            ${{ vars.DOCKERHUB_USERNAME != '' && format('{0}/skillpulse-backend:latest', vars.DOCKERHUB_USERNAME) || 'skillpulse-backend:latest' }}
            ${{ vars.DOCKERHUB_USERNAME != '' && format('{0}/skillpulse-backend:{1}', vars.DOCKERHUB_USERNAME, github.sha) || format('skillpulse-backend:{0}', github.sha) }}

      - name: Build and push frontend
        uses: docker/build-push-action@v7
        with:
          context: ./frontend
          push: ${{ vars.DEPLOY_ENABLED == 'true' }}
          tags: |
            ${{ vars.DOCKERHUB_USERNAME != '' && format('{0}/skillpulse-frontend:latest', vars.DOCKERHUB_USERNAME) || 'skillpulse-frontend:latest' }}
            ${{ vars.DOCKERHUB_USERNAME != '' && format('{0}/skillpulse-frontend:{1}', vars.DOCKERHUB_USERNAME, github.sha) || format('skillpulse-frontend:{0}', github.sha) }}
