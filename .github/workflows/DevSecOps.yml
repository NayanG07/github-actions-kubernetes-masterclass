name: DevSecOps — Security Scanning

on:
  push:
    branches: [main]
    paths-ignore:
      - "**.md"
      - "docs/**"
  pull_request:
    branches: [main]

permissions:
  contents: read
  security-events: write

concurrency:
  group: security-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # ──────────────────────────────────────────────────────────────────────────
  # JOB 1 — Secret scanning
  # ──────────────────────────────────────────────────────────────────────────
  secret-scan:
    name: Secret Scan (Gitleaks)
    runs-on: ubuntu-latest

    steps:
      - name: Checkout (full history)
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Run Gitleaks
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Upload Gitleaks SARIF
        if: always()
        uses: github/codeql-action/upload-sarif@v4
        with:
          sarif_file: results.sarif
          category: gitleaks


  # ──────────────────────────────────────────────────────────────────────────
  # JOB 2 — OWASP Dependency Check
  # ──────────────────────────────────────────────────────────────────────────
  dependency-check:
    name: OWASP Dependency Check
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: OWASP Dependency-Check
        uses: dependency-check/Dependency-Check_Action@main
        with:
          project: "skillpulse"
          path: "./backend"
          format: "ALL"
          out: "odc-reports"
          args: >
            --failOnCVSS 7
            --enableRetired

      - name: Upload OWASP DC report
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: owasp-dependency-check-report
          path: odc-reports/
          retention-days: 30

      - name: Upload OWASP SARIF to Security tab
        uses: github/codeql-action/upload-sarif@v4
        if: always()
        with:
          sarif_file: odc-reports/dependency-check-report.sarif
          category: owasp-dependency-check


  # ──────────────────────────────────────────────────────────────────────────
  # JOB 3 — Trivy backend image scan
  # ──────────────────────────────────────────────────────────────────────────
  trivy-backend:
    name: Trivy — backend image
    runs-on: ubuntu-latest
    needs: secret-scan

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build backend image (local, no push)
        uses: docker/build-push-action@v6
        with:
          context:    ./backend
          file:       ./backend/Dockerfile
          push:       false
          tags:       skillpulse-backend:scan
          load:       true
          # Pass git SHA as cache bust — every commit = fully fresh build
          # This guarantees Trivy always scans the image built from the
          # current commit's dependencies, never a stale cached image.
          build-args: CACHE_BUST=${{ github.sha }}
          cache-from: type=gha,scope=backend
          cache-to:   type=gha,scope=backend,mode=max

      # SARIF scan — continue-on-error so the upload step always runs
      # even if CVEs are found (exit-code 1 would otherwise skip it)
      - name: Run Trivy on backend image (SARIF)
        uses: aquasecurity/trivy-action@master
        continue-on-error: true
        with:
          image-ref:      "skillpulse-backend:scan"
          format:         "sarif"
          output:         "trivy-backend.sarif"
          severity:       "CRITICAL,HIGH"
          exit-code:      "1"
          ignore-unfixed: true
          trivyignores:   ".trivyignore"

      - name: Upload Trivy backend SARIF
        uses: github/codeql-action/upload-sarif@v4
        if: always()
        with:
          sarif_file: trivy-backend.sarif
          category:   trivy-backend

      # Table scan — human-readable output in the Actions log
      # exit-code 1 here is what actually fails the job if CVEs found
      - name: Run Trivy on backend image (table)
        uses: aquasecurity/trivy-action@master
        with:
          image-ref:      "skillpulse-backend:scan"
          format:         "table"
          severity:       "CRITICAL,HIGH,MEDIUM"
          exit-code:      "1"
          ignore-unfixed: true
          trivyignores:   ".trivyignore"


  # ──────────────────────────────────────────────────────────────────────────
  # JOB 4 — Trivy frontend image scan
  # ──────────────────────────────────────────────────────────────────────────
  trivy-frontend:
    name: Trivy — frontend image
    runs-on: ubuntu-latest
    needs: secret-scan

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build frontend image (local, no push)
        uses: docker/build-push-action@v6
        with:
          context:    ./frontend
          file:       ./frontend/Dockerfile
          push:       false
          tags:       skillpulse-frontend:scan
          load:       true
          build-args: CACHE_BUST=${{ github.sha }}
          cache-from: type=gha,scope=frontend
          cache-to:   type=gha,scope=frontend,mode=max

      - name: Run Trivy on frontend image (SARIF)
        uses: aquasecurity/trivy-action@master
        continue-on-error: true
        with:
          image-ref:      "skillpulse-frontend:scan"
          format:         "sarif"
          output:         "trivy-frontend.sarif"
          severity:       "CRITICAL,HIGH"
          exit-code:      "1"
          ignore-unfixed: true
          trivyignores:   ".trivyignore"

      - name: Upload Trivy frontend SARIF
        uses: github/codeql-action/upload-sarif@v4
        if: always()
        with:
          sarif_file: trivy-frontend.sarif
          category:   trivy-frontend

      - name: Run Trivy on frontend image (table)
        uses: aquasecurity/trivy-action@master
        with:
          image-ref:      "skillpulse-frontend:scan"
          format:         "table"
          severity:       "CRITICAL,HIGH,MEDIUM"
          exit-code:      "1"
          ignore-unfixed: true
          trivyignores:   ".trivyignore"


  # ──────────────────────────────────────────────────────────────────────────
  # JOB 5 — Trivy filesystem + IaC scan
  # ──────────────────────────────────────────────────────────────────────────
  trivy-fs:
    name: Trivy — filesystem + IaC
    runs-on: ubuntu-latest
    needs: secret-scan

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Trivy filesystem scan
        uses: aquasecurity/trivy-action@master
        with:
          scan-type:    "fs"
          scan-ref:     "."
          format:       "sarif"
          output:       "trivy-fs.sarif"
          scanners:     "misconfig,secret"
          severity:     "CRITICAL,HIGH"
          exit-code:    "0"
          trivyignores: ".trivyignore"

      - name: Upload Trivy FS SARIF
        uses: github/codeql-action/upload-sarif@v4
        if: always()
        with:
          sarif_file: trivy-fs.sarif
          category:   trivy-filesystem


  # ──────────────────────────────────────────────────────────────────────────
  # JOB 6 — Security gate
  # Single checkpoint — CD depends on this passing
  # ──────────────────────────────────────────────────────────────────────────
  security-gate:
    name: Security Gate ✅
    runs-on: ubuntu-latest
    needs:
      - secret-scan
      - dependency-check
      - trivy-backend
      - trivy-frontend
      - trivy-fs
    if: always()

    steps:
      - name: Check all security jobs passed
        run: |
          echo "secret-scan:       ${{ needs.secret-scan.result }}"
          echo "dependency-check:  ${{ needs.dependency-check.result }}"
          echo "trivy-backend:     ${{ needs.trivy-backend.result }}"
          echo "trivy-frontend:    ${{ needs.trivy-frontend.result }}"
          echo "trivy-fs:          ${{ needs.trivy-fs.result }}"

          if [[ \
            "${{ needs.secret-scan.result }}"      != "success" || \
            "${{ needs.dependency-check.result }}" != "success" || \
            "${{ needs.trivy-backend.result }}"    != "success" || \
            "${{ needs.trivy-frontend.result }}"   != "success" \
          ]]; then
            echo "❌ One or more security checks failed. Blocking image push."
            exit 1
          fi

          echo "✅ All security checks passed. Safe to push images."