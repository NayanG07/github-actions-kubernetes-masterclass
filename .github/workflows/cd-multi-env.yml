name: CD — multi-env deploy

on:
  workflow_dispatch:           # manual trigger from Actions UI (for hotfixes, etc.)
  workflow_run:
    workflows: ["CI"]          # triggers after CI builds + pushes images
    types: [completed]
    branches: [main]

# Only one deploy per env can run at a time — prevents race conditions
concurrency:
  group: deploy-${{ github.ref }}
  cancel-in-progress: false    # don't cancel in-flight deploys, queue them

jobs:
  # ────────────────────────────────────────────────────────────────────────────
  # Job 1: Deploy to DEV (auto, no approval gate)
  # ────────────────────────────────────────────────────────────────────────────
  deploy-dev:
    name: Deploy → dev
    runs-on: ubuntu-latest
    if: github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success'

    # GitHub Environment named "dev" — add env-level secrets there
    # (DEV_KUBECONFIG). No protection rules = deploys immediately.
    environment:
      name: dev
      url: http://${{ vars.DEV_CLUSTER_HOST }}:30081

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up kubectl
        uses: azure/setup-kubectl@v4

      - name: Configure kubeconfig
        run: |
          mkdir -p $HOME/.kube
          echo "${{ secrets.DEV_KUBECONFIG }}" | base64 -d > $HOME/.kube/config
          chmod 600 $HOME/.kube/config

      - name: Pin image tags in dev overlay
        run: |
          SHA=${{ github.sha }}
          SHORT=${SHA::7}
          # kustomize edit set image patches the newTag in-place
          cd k8s/overlays/dev
          kustomize edit set image \
            nayuu/skillpulse-backend=nayuu/skillpulse-backend:${SHORT} \
            nayuu/skillpulse-frontend=nayuu/skillpulse-frontend:${SHORT}

      - name: Apply to dev namespace
        run: |
          kubectl apply -k k8s/overlays/dev
          kubectl rollout status deployment/backend  -n skillpulse-dev --timeout=120s
          kubectl rollout status deployment/frontend -n skillpulse-dev --timeout=120s

      # - name: Smoke test dev
      #   run: |
      #     # Basic HTTP check — if the frontend 404s or 5xx, fail fast before stg
      #     sleep 10
      #     STATUS=$(curl -s -o /dev/null -w "%{http_code}" \
      #       http://${{ vars.DEV_CLUSTER_HOST }}:30081/)
      #     echo "Dev smoke test HTTP status: $STATUS"
      #     [ "$STATUS" = "200" ] || exit 1

  # ────────────────────────────────────────────────────────────────────────────
  # Job 2: Deploy to STG (auto after dev passes, no manual gate)
  # ────────────────────────────────────────────────────────────────────────────
  deploy-stg:
    name: Deploy → stg
    runs-on: ubuntu-latest
    needs: deploy-dev          # only runs if dev job succeeded

    environment:
      name: stg
      url: http://${{ vars.STG_CLUSTER_HOST }}:30082

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up kubectl
        uses: azure/setup-kubectl@v4

      - name: Configure kubeconfig
        run: |
          mkdir -p $HOME/.kube
          echo "${{ secrets.STG_KUBECONFIG }}" | base64 -d > $HOME/.kube/config
          chmod 600 $HOME/.kube/config

      - name: Pin image tags in stg overlay
        run: |
          SHA=${{ github.sha }}
          SHORT=${SHA::7}
          cd k8s/overlays/stg
          kustomize edit set image \
            nayuu/skillpulse-backend=nayuu/skillpulse-backend:${SHORT} \
            nayuu/skillpulse-frontend=nayuu/skillpulse-frontend:${SHORT}

      - name: Apply to stg namespace
        run: |
          kubectl apply -k k8s/overlays/stg
          kubectl rollout status deployment/backend  -n skillpulse-stg --timeout=180s
          kubectl rollout status deployment/frontend -n skillpulse-stg --timeout=180s

      # - name: Smoke test stg
      #   run: |
      #     sleep 10
      #     STATUS=$(curl -s -o /dev/null -w "%{http_code}" \
      #       http://${{ vars.STG_CLUSTER_HOST }}:30082/)
      #     echo "Stg smoke test HTTP status: $STATUS"
      #     [ "$STATUS" = "200" ] || exit 1

  # ────────────────────────────────────────────────────────────────────────────
  # Job 3: Deploy to PRD (requires manual approval via GitHub Environment)
  # ────────────────────────────────────────────────────────────────────────────
  deploy-prd:
    name: Deploy → prd
    runs-on: ubuntu-latest
    needs: deploy-stg          # only runs if stg job succeeded

    # GitHub Environment "prd" must have a Required Reviewer protection rule.
    # The workflow pauses here until a reviewer approves in the Actions UI.
    environment:
      name: prd
      url: http://${{ vars.PRD_CLUSTER_HOST }}:30080

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up kubectl
        uses: azure/setup-kubectl@v4

      - name: Configure kubeconfig
        run: |
          mkdir -p $HOME/.kube
          echo "${{ secrets.PRD_KUBECONFIG }}" | base64 -d > $HOME/.kube/config
          chmod 600 $HOME/.kube/config

      - name: Pin image tags in prd overlay
        run: |
          SHA=${{ github.sha }}
          SHORT=${SHA::7}
          cd k8s/overlays/prd
          kustomize edit set image \
            nayuu/skillpulse-backend=nayuu/skillpulse-backend:${SHORT} \
            nayuu/skillpulse-frontend=nayuu/skillpulse-frontend:${SHORT}

      - name: Apply to prd namespace
        run: |
          kubectl apply -k k8s/overlays/prd
          kubectl rollout status deployment/backend  -n skillpulse-prd --timeout=300s
          kubectl rollout status deployment/frontend -n skillpulse-prd --timeout=300s

      - name: Verify prd health
        run: |
          sleep 15
          STATUS=$(curl -s -o /dev/null -w "%{http_code}" \
            http://${{ vars.PRD_CLUSTER_HOST }}:30080/)
          echo "Prd health check HTTP status: $STATUS"
          [ "$STATUS" = "200" ] || exit 1

      - name: Commit pinned tags back to main
        # GitOps: the repo always reflects exactly what's running in prd
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          SHA=${{ github.sha }}
          SHORT=${SHA::7}
          git add k8s/overlays/prd/kustomization.yaml
          git commit -m "deploy(prd): pin to ${SHORT}" || echo "nothing to commit"
          git push