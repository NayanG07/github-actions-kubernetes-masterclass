name: Local CD — multi-env deploy

on:
  workflow_dispatch:

concurrency:
  group: deploy-${{ github.ref }}
  cancel-in-progress: false

jobs:

  # ─────────────────────────────────────────────
  # DEV
  # ─────────────────────────────────────────────
  deploy-dev:
    name: Deploy → dev
    runs-on: self-hosted

    environment:
      name: dev

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Verify Kubernetes cluster
        run: |
          kubectl cluster-info
          kubectl get nodes

      - name: Verify tools
        run: |
          kubectl version --client
          kustomize version

      - name: Pin image tags in dev overlay
        run: |
          SHA=${GITHUB_SHA}
          SHORT=${SHA::7}

          cd k8s/overlays/dev

          kustomize edit set image \
            nayuu/skillpulse-backend=nayuu/skillpulse-backend:${SHORT} \
            nayuu/skillpulse-frontend=nayuu/skillpulse-frontend:${SHORT}

      - name: Deploy to dev
        run: |
          kubectl apply -k k8s/overlays/dev

      - name: Verify dev rollout
        run: |
          kubectl rollout status deployment/backend -n skillpulse-dev --timeout=120s
          kubectl rollout status deployment/frontend -n skillpulse-dev --timeout=120s

      - name: Show dev resources
        run: |
          kubectl get all -n skillpulse-dev


  # ─────────────────────────────────────────────
  # STG
  # ─────────────────────────────────────────────
  deploy-stg:
    name: Deploy → stg
    runs-on: self-hosted
    needs: deploy-dev

    environment:
      name: stg

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Verify Kubernetes cluster
        run: |
          kubectl cluster-info
          kubectl get nodes

      - name: Pin image tags in stg overlay
        run: |
          SHA=${GITHUB_SHA}
          SHORT=${SHA::7}

          cd k8s/overlays/stg

          kustomize edit set image \
            nayuu/skillpulse-backend=nayuu/skillpulse-backend:${SHORT} \
            nayuu/skillpulse-frontend=nayuu/skillpulse-frontend:${SHORT}

      - name: Deploy to stg
        run: |
          kubectl apply -k k8s/overlays/stg

      - name: Verify stg rollout
        run: |
          kubectl rollout status deployment/backend -n skillpulse-stg --timeout=180s
          kubectl rollout status deployment/frontend -n skillpulse-stg --timeout=180s

      - name: Show stg resources
        run: |
          kubectl get all -n skillpulse-stg


  # ─────────────────────────────────────────────
  # PRD
  # ─────────────────────────────────────────────
  deploy-prd:
    name: Deploy → prd
    runs-on: self-hosted
    needs: deploy-stg

    environment:
      name: prd

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Verify Kubernetes cluster
        run: |
          kubectl cluster-info
          kubectl get nodes

      - name: Pin image tags in prd overlay
        run: |
          SHA=${GITHUB_SHA}
          SHORT=${SHA::7}

          cd k8s/overlays/prd

          kustomize edit set image \
            nayuu/skillpulse-backend=nayuu/skillpulse-backend:${SHORT} \
            nayuu/skillpulse-frontend=nayuu/skillpulse-frontend:${SHORT}

      - name: Deploy to prd
        run: |
          kubectl apply -k k8s/overlays/prd

      - name: Verify prd rollout
        run: |
          kubectl rollout status deployment/backend -n skillpulse-prd --timeout=300s
          kubectl rollout status deployment/frontend -n skillpulse-prd --timeout=300s

      - name: Show prd resources
        run: |
          kubectl get all -n skillpulse-prd

      - name: Commit pinned tags back to repo
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

          git add k8s/overlays/prd/kustomization.yaml

          git commit -m "deploy(prd): pin image tags to ${GITHUB_SHA::7}" || echo "Nothing to commit"

          git push